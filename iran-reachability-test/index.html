<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هم‌بازی — تست دسترسی</title>
<style>
  body{font-family:system-ui,Tahoma,sans-serif;background:#f7faf9;color:#0f1f2e;display:grid;place-items:center;min-height:100vh;margin:0}
  main{background:#fff;border-radius:16px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}
  h1{color:#02834a;margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>هم‌بازی</h1>
  <p>اگر این صفحه را می‌بینید، دسترسی به این میزبان از شبکهٔ شما برقرار است.</p>
  <p dir="ltr" id="t"></p>
</main>
<script>document.getElementById('t').textContent = new Date().toISOString();</script>
</body>
</html>
